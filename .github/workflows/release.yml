name: Build & Release Neo Scanner

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pyinstaller-hooks-contrib pytest httpx
          pip install paddleocr paddlepaddle torch transformers ultralytics

      - name: Download YOLOv8 Weights
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8n-seg.pt')"

      - name: Run Tests
        run: |
          python -m pytest -m "not integration"

      - name: Build with PyInstaller
        run: |
          pyinstaller neo_scanner.spec

      - name: Compile Windows Installer with Inno Setup
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neo_Scanner-Windows-Setup
          path: dist/Neo_Scanner-Setup-v*.exe

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pyinstaller-hooks-contrib pytest httpx
          pip install paddleocr paddlepaddle torch transformers ultralytics

      - name: Download YOLOv8 Weights
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8n-seg.pt')"

      - name: Run Tests
        run: |
          python -m pytest -m "not integration"

      - name: Build with PyInstaller
        run: |
          pyinstaller neo_scanner.spec --noconfirm

      - name: Package .dmg with hdiutil
        run: |
          mkdir -p dist/dmg_staging
          cp -R "dist/Neo Scanner.app" dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create -volname "Neo Scanner" -srcfolder dist/dmg_staging -ov -format UDZO dist/Neo_Scanner-macOS-v1.0.0.dmg
          rm -rf dist/dmg_staging

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neo_Scanner-macOS-DMG
          path: dist/Neo_Scanner-macOS-v*.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Neo_Scanner-Windows-Setup
          path: release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Neo_Scanner-macOS-DMG
          path: release_assets

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release_assets/*
          generate_release_notes: true
