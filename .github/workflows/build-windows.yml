name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Neo Scanner for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pyinstaller-hooks-contrib pytest httpx
          pip install paddleocr paddlepaddle torch transformers ultralytics

      - name: Download YOLOv8 Weights
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8n-seg.pt')"

      - name: Run Tests
        run: |
          python -m pytest -m "not integration"

      - name: Build with PyInstaller
        run: |
          pyinstaller neo_scanner.spec

      - name: Compile Windows Installer with Inno Setup
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neo_Scanner-Windows-Setup
          path: dist/Neo_Scanner-Setup-v*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Neo_Scanner-Setup-v*.exe
          generate_release_notes: true
